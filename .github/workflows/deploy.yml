name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        env:
          # 커스텀 도메인은 루트에서 서빙되므로 base는 '/'
          # (github.io 하위 경로로 되돌리려면 아래를 원래대로 바꾸고 CNAME 파일을 지운다)
          SITE_URL: https://jusikgongbu.org
          BASE_PATH: /
          # 구글 애드센스 게시자 ID (공개 정보 — 모든 페이지 소스에 노출되는 값이다)
          # 비우면 광고 스크립트가 전혀 삽입되지 않는다.
          PUBLIC_ADSENSE_CLIENT: ca-pub-4765583252345532
          # 검색엔진 소유권 확인 코드 (공개 값)
          PUBLIC_NAVER_VERIFY: d809f330caa22b0b8b03089d0be2234e7fc87ca7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
